plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
}
def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
def hasKeystoreFile = keystorePropertiesFile.exists()
if (hasKeystoreFile) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    logger.lifecycle('Warning: key.properties not found, fallback to debug keystore.')
}
android {
    namespace 'com.maibot.maibot_android'
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = 17
        targetCompatibility = 17
    }

    signingConfigs {
        if (hasKeystoreFile) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                def storeFileValue = keystoreProperties['storeFile']
                if (storeFileValue != null) {
                    storeFile file(storeFileValue)
                }
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        applicationId 'com.maibot.maibot_android'
        minSdk = 24
        targetSdk = 37
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    lint {
        disable 'InvalidPackage'
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
    buildTypes {
        release {
            signingConfig hasKeystoreFile ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 禁用对特定原生库的strip操作，避免处理错误
            packaging {
                doNotStrip '**/libsudo.so'
            }
        }
        debug {
            signingConfig hasKeystoreFile ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            // 禁用对特定原生库的strip操作，避免处理错误
            packaging {
                doNotStrip '**/libsudo.so'
            }
        }
    }

    project.android.applicationVariants.all { variant ->
        variant.outputs.each { output ->
            output.versionCodeOverride = flutter.versionCode
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}
dependencies {
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

// implementation fileTree(include: ['*.jar', '*aar'], dir: 'libs')
}
